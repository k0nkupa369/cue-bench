name: Replay fictional orders
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run demo
      - run: node src/retail/verify-publication.ts
      - run: npm run research:report
